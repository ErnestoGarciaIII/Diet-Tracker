<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restrictions - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/mainStyleS.css') }}">
</head>
<body id="restrictionsPage">

    <div class="onboardingContainer">
        <div class="progressBarContainer">
            <div class="profileProgressBar" style="width: 100%;"></div>
        </div>

        <div class="formCard">
            <h2>Any restrictions?</h2>
            <p class="formSubtitle">Step 3: Tell the AI what to exclude.</p>

            <div class="tagsGrid">
                <div class="tag" id="Vegan" data-value="Vegan">Vegan</div>
                <div class="tag" id="Vegetarian" data-value="Vegetarian">Vegetarian</div>
                <div class="tag" id="Gluten-Free" data-value="Gluten-Free">Gluten-Free</div>
                <div class="tag" id="Dairy-Free" data-value="Dairy-Free">Dairy-Free</div>
                <div class="tag" id="Keto" data-value="Keto">Keto</div>
                <div class="tag" id="Nut-Free" data-value="Nut-Free">No Nuts</div>
                <div class="tag" id="Pescatarian" data-value="Pescatarian">Pescatarian</div>
                <div class="tag" id="Lactose-Free" data-value="Lactose-Free">Lactose Intolerant</div>
                <div class="tag" id="None" data-value="None">None</div>
            </div>

            <button type="button" id="finishBtn" class="RUGRbtn pagesBtn-primary full-width mt-20" data-url="{{ url_for('html_urls', filename='dashboard.html') }}">Finish & Generate Plan</button>
            <button type="button" id="backBtn" class="RUGRbtn pagesBtn-secondary full-width mt-10">Back</button>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
