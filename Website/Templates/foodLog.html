<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="..\static\stylesheets\mainStyleS.css">
</head>
<body class="bod1" id="foodLogPage">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <img id="profilePreview" class="navAvatar">
        <div>
            <a href="{{ url_for('html_urls', filename='dashboard.html') }}">
                <div class="navIcon">
                    <i class="fa-regular fa-house fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='foodLog.html') }}">
                <div class="navIcon active">
                    <i class="fa-solid fa-clipboard fa-beat fa-xl" style="color: rgb(94, 234, 100);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='history.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-calendar fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='settings.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-gear fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='logout.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
    </nav>
    <!-- Food Log Section -->
    <main class="logContent">    
        <div class="card trackerCard">
            <h2> Fuel the plane ✈️</h2>
            <p class="formSubtitle">Search for foods, select them, and log your calories to move the plane.</p>
            <!-- Food Input -->
            <div class="inputGroup">
                <label for="foodInput"> Food Name</label>
                <div class="inputWrapper">
                    <input type="text" id="foodInput" list="foodOptions" placeholder="What did you eat?">
                    <button id="addFoodBtn" class="RUGRbtn pagesBtn-secondary">
                        <i class="fa-solid fa-magnifying-glass" style="color: rgb(60, 163, 245);"></i>
                    </button>
                </div>
                <!-- filter button section-->
                <div class="filterButtons">
                    <button id="VeganFilBtn" class="filterBtn" data-value="Vegan">Vegan</button>
                    <button id="vegFilBtn" class="filterBtn" data-value="Vegetarian">Vegetarian</button>
                    <button id="dairyFilBtn" class="filterBtn" data-value="Dairy-Free">Dairy-Free</button>
                    <button id="ketoFilBtn" class="filterBtn" data-value="Keto">Keto</button>
                    <button id="nutsFilBtn" class="filterBtn" data-value="No Nuts">No Nuts</button>
                    <button id="pescFilBtn" class="filterBtn" data-value="Pescatarian">Pescatarian</button>
                    <button id="shellFilBtn" class="filterBtn" data-value="Shellfish">Shellfish</button>
                    <button id="soyFilBtn" class="filterBtn" data-value="Soy Free">Soy Free</button>
                    <button id="eggFilBtn" class="filterBtn" data-value="Egg-Free">Egg-Free</button>
                </div>
                <datalist id="foodSearch"></datalist>

                <div class="inputGroup">
                    <label for="calInput"> Calories (kcal)</label>
                    <input type="number" id="calInput" placeholder="e.g. 350">
                </div>
            </div>
            <div class="resultContent" id="resultContent">
                <h3>Search Results:</h3>
                <div id="resultsList"></div>
            </div>
        </div>
    </main>

    <!-- Log Summary (cart) section-->
    <main class="logContent">
        <div class="summaryCard trackerCard">
            <h2> Log Summary</h2>
            <p class="formSubtitle"> Review your log before submitting.</p>
            <!-- shows vague current logged items-->
            <div class="logContainer">
                <label>Foods to Log:</label>
                <div id="historyList"></div>
            </div>
            <!-- Log Food Button -->
            <button class="RUGRbtn pagesBtn-primary full-width" id="logButton">Log Selected Foods</button>
            <!-- History Link link -->
            <div>
                <a href="{{ url_for('html_urls', filename='history.html') }}" class="navLink"> View History 
                    <i class="fa-solid fa-arrow-right fa-xlg" style="color: #3498db;"></i>
                </a>
            </div>
            <!-- Dashboard Link -->
            <div>
                <a href="{{ url_for('html_urls', filename='dashboard.html') }}" class="navLink">Back to Dashboard
                    <i class="fa-solid fa-arrow-right fa-xlg" style="color: #3498db;"></i>
                </a>
            </div>
        </div>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
