<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/mainStyleS.css') }}">
</head>
<body id="loginPage">
    <div class="onboardingContainer">
        <h1 id="mainTitle">PlatePilot</h1> 
        <div class="formCard loginCard">
            <div class="mainFlex">
                <div class="contentSide">
                    <h2 class="heading2">Welcome Back!</h2>
                    <p class="formSubtitle">Log in to track your progress.</p>

                    <form id="loginForm">
                        <!-- form elements i.e email   -->
                        <div class="inputGroup">
                            <label>Email Address</label>
                            <input type="text" id="loginEmail" placeholder="Email" required autofocus>
                        </div>
                        <!-- form elements i.e password -->
                        <div class="inputGroup">
                            <label>Password</label>
                            <input type="password" id="loginPassword" placeholder="Password" required>
                        </div>
                        <!-- form elements i.e submit button -->
                        <button class="RUGRbtn pagesBtn-primary full-width" type="submit" id="loginButton" data-url="{{ url_for('html_urls', filename='dashboard.html') }}">
                            Login
                        </button>
                    </form>
                    <!-- form elements i.e different links -->
                    <p class="account" id="account">Don't have an account? <a href="{{ url_for('html_urls', filename='register.html') }}">Register here</a></p>
                <p class="account" id="forgotPassword">Forgot password? <a href="{{ url_for('html_urls', filename='forgotPassword.html') }}">Reset here</a></p>
                </div>
                <!-- form elements i.e mascot/motto-->
                <div class="imageSide" id="imageSide">
                    <img src="{{ url_for('static', filename='images/MascotPilot.png') }}" alt="Healthy Lifestyle">
                </div>
            </div>
        </div>
    </div>
	<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
<footer class="homeFooter">
    <p class="homeFooterTxt">© 2026 PlatePilot. All rights reserved.</p>
    <p class="homeFooterTxt"><a href="{{ url_for('html_urls', filename='privacy.html') }}">Privacy Policy</a> | <a href="{{ url_for('html_urls', filename='terms.html') }}">Terms of Service</a></p>
    <p class="homeFooterTxt"><a href="mailto:berkscott998@outlook.com">Contact Us</a></p>
</footer>
</html>
