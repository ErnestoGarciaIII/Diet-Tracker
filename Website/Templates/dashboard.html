<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/mainStyleS.css') }}">
</head>
<body id="dashboardPage">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <img id="profilePreview" class="navAvatar">
        <div>
            <a href="{{ url_for('html_urls', filename='dashboard.html') }}">
                <div class="navIcon active">
                    <i class="fa-regular fa-house fa-beat fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='foodLog.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-clipboard fa-xl" style="color: rgb(94, 234, 100);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='history.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-calendar fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='settings.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-gear fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='logout.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
    </nav>

    <main class="dashContent">
        <header class="dashHeader">
            <h1>Welcome <span class="userBadge" id="userNameDisplay"></span>! 🌿</h1>
            <p>Your body's co-pilot for better fuel.</p>
        </header>

        <div class="statsPanel">
            <div class="leftCol">
                <div class="card trackerCard">
                    <!-- plane progress bar-->
                    <div class="statCard">
                        <span>Rank: <span id="planeRank">Cessna</span></span>
                        <span>Goal: <span id="currentTotal"></span> / <span id="goalNum"></span> kcal</span>
                    </div>
                    <!-- calories progress bar-->
                    <h4>Calories</h4>
                    <div class="progressWrapper">
                        <div id="kcalProgressBar"></div>
                        <span id="kcalBarPercent" class="progressInlinePercent">0%</span>
                        <div id="planeIcon">🛩️</div>
                    </div>
                    <!-- macros progress bar-->
                    <h4>Macros</h4>
                    <div class ="progressWrapper">
                        <div id="gProgressBar"> </div>
                        <span id="gBarPercent" class="progressInlinePercent">0%</span>
                        <div id="planeIcon1">🛩️</div>
                    </div>
                    <!-- micros progress bar-->
                    <h4>Micros</h4>
                    <div class ="progressWrapper">
                        <div id="mgProgressBar"> </div>
                        <span id="mgBarPercent" class="progressInlinePercent">0%</span>
                        <div id="planeIcon2">🛩️</div>
                    </div>
                    <!-- motivational quotes -->
                    <div id="motivational" class="motivationalQuote">
                    </div>
                    <!-- link to food log -->
                    <a href="{{ url_for('html_urls', filename='foodLog.html') }}" class="navLink">
                        <i class="fa-solid fa-arrow-left fa-xlg" style="color: #3498db;"></i>
                        Go to Food Logging
                    </a>
                    <details id="dashboardMoreDetailsDropdown" class="moreNutrientsDropdown">
                        <summary>More Details</summary>
                        <div id="dashboardMoreDetailsGraph" class="moreNutrientsGraph"></div>
                    </details>
                </div>
            </div>
            <div class="rightCol">
                <div class="chartContainer">
                    <div class="card chartCard">
                        <h3>7-Day Activity Level</h3>
                        <div class="canvasWrapper">
                            <canvas id="activityChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
	<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
<footer>
    <p class="homeFooterTxt">© 2026 PlatePilot. All rights reserved.</p>
    <p class="homeFooterTxt"><a href="{{ url_for('html_urls', filename='privacy.html') }}">Privacy Policy</a> | <a href="{{ url_for('html_urls', filename='terms.html') }}">Terms of Service</a></p>
    <p class="homeFooterTxt"><a href="mailto:berkscott998@outlook.com">Contact Us</a></p>
</footer>
</html>
