<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Goal - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/mainStyleS.css') }}">
</head>
<body id="goalsPage">
    <div class="onboardingContainer">
        <div class="progressBarContainer">
            <div class="profileProgressBar" style="width: 66%;"></div>
        </div>
        <!-- title section -->
        <div class="formCard">
            <h2>What is your goal?</h2>
            <p class="formSubtitle">This helps the AI calculate your daily targets.</p>
            <!-- section 1-->
            <div class="goalGrid">
                <div class="goalCard" id="lose" data-goalId="1">
                    <div class="goalIcon">🔥</div>
                    <div class="goalContent">
                        <h3>Weight Loss</h3>
                        <p>Burn fat and get leaner</p>
                    </div>
                </div>
                <!-- section 2-->
                <div class="goalCard" id="maintain" data-goalId="2">
                    <div class="goalIcon">⚖️</div>
                    <div class="goalContent">
                        <h3>Maintain</h3>
                        <p>Keep your current weight</p>
                    </div>
                </div>
                <!-- section 3-->
                <div class="goalCard" id="gain" data-goalId="3">
                    <div class="goalIcon">💪</div>
                    <div class="goalContent">
                        <h3>Muscle Build</h3>
                        <p>Build strength and mass</p>
                    </div>
                </div>
            </div>

            <button type="button" id="continueBtn" class="RUGRbtn pagesBtn-primary full-width" data-url="{{ url_for('html_urls', filename='restrictions.html') }}">Continue</button>
            <button type="button" id="backBtn" class="RUGRbtn pagesBtn-secondary full-width">Back</button>
        </div>
    </div>

	<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
<footer>
    <p class="homeFooterTxt">© 2026 PlatePilot. All rights reserved.</p>
    <p class="homeFooterTxt">Privacy Policy | Terms of Service</p>
    <p class="homeFooterTxt">Contact Us: <a href="mailto:berkscott998@outlook.com">Email</a></p>
</footer>
</html>
