<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='stylesheets/mainStyleS.css') }}">
</head>
<body id="historyPage">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <img id="profilePreview" class="navAvatar">
        <div>
            <a href="{{ url_for('html_urls', filename='dashboard.html') }}">
                <div class="navIcon">
                    <i class="fa-regular fa-house fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='foodLog.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-clipboard fa-xl" style="color: rgb(94, 234, 100);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='history.html') }}">
                <div class="navIcon active">
                    <i class="fa-solid fa-calendar fa-beat fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='settings.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-gear fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('html_urls', filename='logout.html') }}">
                <div class="navIcon">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
    </nav>
	
    <main class="dashContent">
        <div class="card">
            <h1 class="trackerCard">Activity History</h1>
            <p class="formSubtitle">Review your past activities and progress.</p>

            <div class="calendarNav">
                <button onclick="changeMonth(-1)" class="calendarBtn"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="monthDisplay"></h2>
                <button onclick="changeMonth(1)" class="calendarBtn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- calendar section-->
            <div id="calendarGrid" class="calendarGrid">
                <div class="dayLabel">Sun</div>
                <div class="dayLabel">Mon</div>
                <div class="dayLabel">Tue</div>
                <div class="dayLabel">Wed</div>
                <div class="dayLabel">Thu</div>
                <div class="dayLabel">Fri</div>
                <div class="dayLabel">Sat</div>
            </div>

            <!-- Jump to Today Button -->
            <div class="btnSec">
                <button class="jumpBtn">
                    <i class="fa-solid fa-calendar-day"></i> Jump to Today
                </button>
            </div>
            <!-- History display-->
            <div id="dayDetails" class="dayDetails">
                <h3 id="selectedDateHeader"></h3>
                <div id="historyList"></div>
            </div>
        </div>
    </main>
	<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
<footer>
    <p class="homeFooterTxt">© 2026 PlatePilot. All rights reserved.</p>
    <p class="homeFooterTxt"><a href="{{ url_for('html_urls', filename='privacy.html') }}">Privacy Policy</a> | <a href="{{ url_for('html_urls', filename='terms.html') }}">Terms of Service</a></p>
    <p class="homeFooterTxt"><a href="mailto:berkscott998@outlook.com">Contact Us</a></p>
</footer>
</html>
