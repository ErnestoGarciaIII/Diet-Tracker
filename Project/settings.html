<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard - PlatePilot</title>
    <script src="https://kit.fontawesome.com/6487b0dbb2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="stylesheets/mainStyleS.css">
</head>
<body>
    <nav class="navbar">
        <img src="images\defaultAvatar.jpg" class="navAvatar">
        <div>
            <a href="dashboard.html">
                <div class="navIcon">
                    <i class="fa-regular fa-house fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="foodLog.html">
                <div class="navIcon">
                    <i class="fa-solid fa-clipboard fa-xl" style="color: rgb(94, 234, 100);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="history.html">
                <div class="navIcon">
                    <i class="fa-solid fa-calendar fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>

        <div>
            <a href="settings.html">
                <div class="navIcon active">
                    <i class="fa-solid fa-gear fa-beat fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
        <div>
            <a href="logout.html">
                <div class="navIcon">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-xl" style="color: rgba(94, 234, 100, 1.00);"></i>
                </div>
            </a>
        </div>
    </nav>

    <div class="dashContent">
        <div class="card settingsCard">
            <h1 class="trackerCard">Account Settings</h1>
            <p class="formSubtitle">Manage your account information.</p>
            <div> 
                <h2> Basic info</h2>
                <div class="profilePicRow">
                    <span class="profileLabel"> Profile Picture</span>
                    <div class="avatarEdit">
                        <img src="images\defaultAvatar.jpg" id="profilePreview" class="mainAvatar">
                        <div class="avatarControls">
                            <span class="upload" id="uploadTrigger">Upload new picture</span>
                            <span class="remove" id="removePic">Remove</span>

                            <input type="file" id="fileInput" accept="image/*" style="display:none;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="infoList">
                <div class="infoItem">
                    <span class="label">Name:</span>
                    <span class="value" id="userNameDisplay"></span>
                    <span class="arrow">></span>
                </div>
                <div class="infoItem">
                    <span class="label">Gender:</span>
                    <span class="value" id="userGenderDisplay"></span>
                    <span class="arrow">></span>
                </div>
                <div class="infoItem">
                    <span class="label">Age:</span>
                    <span class="value" id="userAgeDisplay"></span>
                    <span class="arrow">></span>
                </div>
                    <div class="infoItem">
                    <span class="label">Weight (Lbs):</span>
                    <span class="value" id="userWeightDisplay"></span>
                    <span class="arrow">></span>
                </div>
                    <div class="infoItem">
                    <span class="label">Height (In):</span>
                    <span class="value" id="userHeightDisplay"></span>
                    <span class="arrow">></span>
                </div>
            </div>

            <h3 class="accountTxt">Account Info</h3>
            <div class="infoList">

                <div class="infoItem">
                    <span class="label">Email:</span>
                    <span class="value" id="userEmailDisplay"></span>
                    <span ><a href="login.html" class="arrow">></a></span>
                </div>
                
                <div class="infoItem">
                    <span class="label">Password:</span>
                    <span class="value" id="userPassword">••••••••</span>
                    <span ><a href="login.html" class="arrow">></a></span>
                </div>
            </div>
            
            
            <footer class="settingsFooter">
                <!-- <button class="RUGRbtn cancelBtn">Cancel</button>
                <button class="RUGRbtn pagesBtn-primary">Save Changes</button> -->
                <button class="RUGRbtn deleteBtn">Delete Account</button>
            </footer>
        </div>
    </div>
    <script src="js files/dashboard.js"></script>
</body>
</html>
