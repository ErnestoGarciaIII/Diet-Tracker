<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PlatePilot</title>
    <link rel="stylesheet" href="stylesheets/styles.css">
</head>
<body>
    <div class="onboardingContainer">
        <div class="formCard loginCard"> <div class="mainFlex">
                <div class="contentSide">
                    <h2>Create Account</h2>
                    <p class="form-subtitle">Join the 5+ decent eaters today.</p>
                    
                    <form id="credentialsForm">
                        <div class="inputGroup">
                            <label>Email Address</label>
                            <input type="email" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="inputGroup">
                            <label>Password</label>
                            <input type="password" id="password" placeholder="Min. 8 characters" required>
                        </div>
                        <div class="inputGroup">
                            <label>Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                        </div>
                        
                        <button class="btn btn-primary full-width" type="submit">
                            Sign Up
                        </button>
                    </form>
                    
                    <p class="account">Already have an account? <a href="login.html">Login here</a></p>
                </div>

                <div class="imageSide">
                    <img src="images/MascotPilot.png" alt="Healthy Food">
                </div>
            </div>
        </div>
    </div>
    <script src="js files/auth.js"></script>
</body>
</html>
