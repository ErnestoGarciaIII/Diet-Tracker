<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PlatePilot</title>
    <link rel="stylesheet" href="stylesheets/styles.css"> </head>
<body>

    <div class="onboardingContainer">
        <div class="progressContainer">
            <div class="progressBar" style="width: 33%;"></div>
        </div>

        <div class="formCard">
            <h2>Let's build your profile</h2>
            <p class="form-subtitle">Step 1: Your Biometrics</p>

            <form id="dietary-form">
                <div class="inputGroup">
                    <label for="age">How old are you?</label>
                    <input type="number" id="age" placeholder="e.g. 25" required>
                </div>

                <div class="inputGroup">
                    <label for="weight">Weight (lbs)</label>
                    <input type="number" id="weight" placeholder="e.g. 130" required>
                </div>

                <div class="inputGroup">
                    <label for="sex">Sex</label>
                    <input type="text" id="sex" placeholder="e.g. Male" required>
                </div>

                <div class="inputGroup">
                    <label for="height">Height (in)</label>
                    <input type="number" id="height" placeholder="e.g. 67" required>
                </div>

                <button type="submit" class="btn btn-primary full-width">Continue</button>
            </form>
        </div>
    </div>
    <script src="js files/userInfo.js"></script>
</body>
</html>
